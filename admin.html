<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理｜意願調查系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d26;
    --surface2: #22263a;
    --border: #2e3347;
    --accent: #d4a853;
    --accent2: #5a7a52;
    --red: #e05c44;
    --text: #e8e2d8;
    --muted: #7a7e8e;
    --gold-glow: rgba(212,168,83,0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
  }

  /* LOGIN */
  #loginScreen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(212,168,83,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 70%, rgba(90,122,82,0.05) 0%, transparent 60%),
      var(--bg);
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .login-logo {
    width: 56px;
    height: 56px;
    background: linear-gradient(135deg, var(--accent), #a07830);
    border-radius: 14px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28.8px;
  }
  .login-box h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 24px;
    margin-bottom: 6px;
  }
  .login-box p {
    font-size: 15.6px;
    color: var(--muted);
    margin-bottom: 32px;
  }
  .login-box input {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 19.2px;
    text-align: center;
    letter-spacing: 4px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.2s;
    font-family: monospace;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), #a07830);
    color: #1a0f00;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: opacity 0.2s;
  }
  .login-btn:hover { opacity: 0.9; }
  .login-error {
    color: var(--red);
    font-size: 15.6px;
    margin-top: 10px;
    display: none;
  }

  /* ADMIN */
  #adminScreen { display: none; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar-logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, var(--accent), #a07830);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16.8px;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 1px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-refresh, .btn-export, .btn-logout {
    padding: 8px 16px;
    border-radius: 8px;
    border: none;
    font-size: 15.6px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-refresh {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-refresh:hover { border-color: var(--accent); }
  .btn-export {
    background: var(--accent2);
    color: white;
  }
  .btn-export:hover { opacity: 0.85; }
  .btn-logout {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-logout:hover { color: var(--red); border-color: var(--red); }

  .main-content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent);
  }
  .stat-card.green::before { background: var(--accent2); }
  .stat-card.red::before { background: var(--red); }
  .stat-label {
    font-size: 13.2px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .stat-value {
    font-size: 38.4px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-card.green .stat-value { color: var(--accent2); }
  .stat-card.red .stat-value { color: var(--red); }
  .stat-sub { font-size: 14.4px; color: var(--muted); }

  /* Charts section */
  .charts-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 32px;
  }
  @media(max-width: 700px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .chart-card h3 {
    font-size: 15.6px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .bar-item { margin-bottom: 14px; }
  .bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 14.4px;
    color: var(--text);
    margin-bottom: 6px;
  }
  .bar-label span:last-child { color: var(--muted); }
  .bar-track {
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), #f0c070);
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .bar-fill.green { background: linear-gradient(90deg, var(--accent2), #7aaa70); }

  /* Table */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .table-header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .table-header h3 {
    font-size: 16.8px;
    font-weight: 500;
  }
  .table-count {
    font-size: 14.4px;
    color: var(--muted);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead tr {
    background: var(--surface2);
  }
  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 13.2px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  td {
    padding: 13px 16px;
    font-size: 15.6px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 13.2px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-support { background: rgba(90,122,82,0.2); color: #8aba82; }
  .badge-condition { background: rgba(212,168,83,0.2); color: #d4a853; }
  .badge-concern { background: rgba(100,130,180,0.2); color: #90b0e0; }
  .badge-reserve { background: rgba(200,100,80,0.2); color: #e07060; }
  .q2-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .q2-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 13.2px;
    color: var(--muted);
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 16.8px;
  }
  .loading-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 16.8px;
  }

  .timestamp { color: var(--muted); font-size: 14.4px; }
  .name-cell { font-weight: 500; }

  /* Action buttons in table */
  .action-btns { display: flex; gap: 6px; }
  .btn-edit, .btn-delete {
    padding: 4px 10px;
    border-radius: 6px;
    border: none;
    font-size: 13.2px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-edit {
    background: rgba(212,168,83,0.15);
    color: var(--accent);
    border: 1px solid rgba(212,168,83,0.3);
  }
  .btn-edit:hover { background: rgba(212,168,83,0.28); }
  .btn-delete {
    background: rgba(224,92,68,0.12);
    color: var(--red);
    border: 1px solid rgba(224,92,68,0.3);
  }
  .btn-delete:hover { background: rgba(224,92,68,0.25); }

  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    animation: modalIn 0.25s cubic-bezier(0.34,1.4,0.64,1);
  }
  @keyframes modalIn {
    from { transform: scale(0.92) translateY(10px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .modal-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 20.4px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-sub {
    font-size: 14.4px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 13.2px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 7px;
  }
  .form-group input[type="text"],
  .form-group select {
    width: 100%;
    padding: 11px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 16.8px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input[type="text"]:focus,
  .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: var(--surface2); }
  .checkbox-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .checkbox-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .checkbox-item:hover { border-color: var(--accent2); }
  .checkbox-item input[type="checkbox"] {
    accent-color: var(--accent2);
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .checkbox-item span { font-size: 15.6px; }
  .modal-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .btn-modal-cancel {
    padding: 10px 20px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    font-size: 15.6px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
  }
  .btn-modal-cancel:hover { border-color: var(--text); color: var(--text); }
  .btn-modal-save {
    padding: 10px 24px;
    background: var(--accent);
    color: #1a0f00;
    border: none;
    border-radius: 8px;
    font-size: 15.6px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: opacity 0.15s;
  }
  .btn-modal-save:hover { opacity: 0.85; }

  /* Delete confirm modal */
  .delete-icon {
    width: 52px;
    height: 52px;
    background: rgba(224,92,68,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26.4px;
    margin-bottom: 16px;
  }
  .btn-modal-delete {
    padding: 10px 24px;
    background: var(--red);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15.6px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: opacity 0.15s;
  }
  .btn-modal-delete:hover { opacity: 0.85; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15.6px;
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    z-index: 300;
    display: flex;
    align-items: center;
    gap: 8px;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.4,0.64,1);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: var(--accent2); }
  .toast.error { border-color: var(--red); }

  @media(max-width: 600px) {
    .topbar { padding: 0 16px; }
    .topbar h1 { display: none; }
    .main-content { padding: 20px 16px; }
    .btn-refresh span { display: none; }
    .modal-box { padding: 24px 18px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🔐</div>
    <h2>後台管理系統</h2>
    <p>雲科 × 湖山意願調查 · 管理員入口</p>
    <input type="password" id="passwordInput" placeholder="請輸入管理員密碼" maxlength="20">
    <button class="login-btn" onclick="doLogin()">登入系統</button>
    <div class="login-error" id="loginError">密碼錯誤，請重新輸入</div>
  </div>
</div>

<!-- ADMIN -->
<div id="adminScreen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">📊</div>
      <h1>意願調查後台</h1>
    </div>
    <div class="topbar-right">
      <button class="btn-refresh" onclick="loadData()"><span>重新整理</span> 🔄</button>
      <button class="btn-export" onclick="exportExcel()">📥 下載 Excel</button>
      <button class="btn-logout" onclick="doLogout()">登出</button>
    </div>
  </div>

  <div class="main-content">
    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">總回覆數</div>
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-sub">份問卷</div>
      </div>
      <div class="stat-card green">
        <div class="stat-label">支持交出手機</div>
        <div class="stat-value" id="statSupport">—</div>
        <div class="stat-sub">含全力支持＋有條件＋有顧慮</div>
      </div>
      <div class="stat-card red">
        <div class="stat-label">保留態度</div>
        <div class="stat-value" id="statReserve">—</div>
        <div class="stat-sub">傾向自行保管</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">最多人支持配套</div>
        <div class="stat-value" style="font-size: 21.6px; padding-top:4px" id="statTopQ2">—</div>
        <div class="stat-sub">手機保管方式</div>
      </div>
    </div>

    <!-- Charts -->
    <div class="charts-row">
      <div class="chart-card">
        <h3>Q1 · 手機交出意願分佈</h3>
        <div id="q1Chart"></div>
      </div>
      <div class="chart-card">
        <h3>Q2 · 保管配套偏好（複選）</h3>
        <div id="q2Chart"></div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-header">
        <h3>回覆明細</h3>
        <div class="table-count" id="tableCount">共 0 筆</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>填答時間</th>
              <th>稱呼</th>
              <th>Q1 手機交出意願</th>
              <th>Q2 保管配套（複選）</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="6" class="loading-state">載入中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-title">✏️ 編輯回覆資料</div>
    <div class="modal-sub" id="editModalSub"></div>
    <div class="form-group">
      <label>稱呼</label>
      <input type="text" id="editName" placeholder="輸入稱呼">
    </div>
    <div class="form-group">
      <label>Q1 手機交出意願（單選）</label>
      <select id="editQ1">
        <option value="全力支持">全力支持</option>
        <option value="支持但有條件">支持，但有條件</option>
        <option value="支持但有顧慮">支持，但有顧慮</option>
        <option value="持保留態度">持保留態度</option>
      </select>
    </div>
    <div class="form-group">
      <label>Q2 手機保管配套（複選）</label>
      <div class="checkbox-group">
        <label class="checkbox-item">
          <input type="checkbox" id="editQ2_1" value="全天候封存">
          <span>全天候封存</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="editQ2_2" value="特定時段開放">
          <span>特定時段開放</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="editQ2_3" value="定點開放">
          <span>定點開放</span>
        </label>
        <label class="checkbox-item">
          <input type="checkbox" id="editQ2_4" value="官方紀錄">
          <span>官方紀錄</span>
        </label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-modal-cancel" onclick="closeModal('editModal')">取消</button>
      <button class="btn-modal-save" onclick="saveEdit()">儲存變更</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-box" style="max-width:400px; text-align:center">
    <div class="delete-icon" style="margin: 0 auto 16px">🗑️</div>
    <div class="modal-title" style="justify-content:center">確認刪除？</div>
    <div class="modal-sub" id="deleteModalSub" style="margin-bottom:8px"></div>
    <p style="font-size: 15.6px; color:var(--muted); margin-bottom:0">此操作無法復原，該筆資料將從 Firebase 永久移除。</p>
    <div class="modal-footer" style="justify-content:center">
      <button class="btn-modal-cancel" onclick="closeModal('deleteModal')">取消</button>
      <button class="btn-modal-delete" onclick="confirmDelete()">確認刪除</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ✅ 請將以下設定替換為您的 Firebase 專案設定
  const firebaseConfig = {
    apiKey: "AIzaSyA4pcwGPb6PRKU2Cpsqo6S0zAefY-KjyBM",
    authDomain: "mobile01-55a64.firebaseapp.com",
    databaseURL: "https://mobile01-55a64-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "mobile01-55a64",
    storageBucket: "mobile01-55a64.firebasestorage.app",
    messagingSenderId: "687175255662",
    appId: "1:687175255662:web:141eca9d013fe3bc36887f"
  };

  const ADMIN_PASSWORD = "12345678";
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let allData = [];
  let currentEditId = null;
  let currentDeleteId = null;

  // ── Login / Logout ──
  window.doLogin = function() {
    const pw = document.getElementById('passwordInput').value;
    if (pw === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminScreen').style.display = 'block';
      window.loadData();
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('passwordInput').value = '';
    }
  };
  document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.doLogin();
  });
  window.doLogout = function() {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminScreen').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  };

  // ── Load Data ──
  window.loadData = function() {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="loading-state">載入資料中…</td></tr>';
    onValue(ref(db, 'surveys'), snapshot => {
      const raw = snapshot.val();
      allData = raw ? Object.entries(raw).map(([id, v]) => ({ id, ...v })) : [];
      allData.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      renderAll(allData);
    }, { onlyOnce: true });
  };

  function renderAll(data) {
    renderStats(data);
    renderCharts(data);
    renderTable(data);
  }

  // ── Stats ──
  function renderStats(data) {
    const total = data.length;
    const support = data.filter(d => d.q1 !== '持保留態度').length;
    const reserve = data.filter(d => d.q1 === '持保留態度').length;
    const q2Count = {};
    data.forEach(d => {
      if (d.q2_array) d.q2_array.forEach(v => { q2Count[v] = (q2Count[v]||0)+1; });
    });
    const topQ2 = Object.entries(q2Count).sort((a,b) => b[1]-a[1])[0];
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statSupport').textContent = support;
    document.getElementById('statReserve').textContent = reserve;
    document.getElementById('statTopQ2').textContent = topQ2 ? topQ2[0] : '—';
    document.getElementById('tableCount').textContent = `共 ${total} 筆`;
  }

  // ── Charts ──
  function renderCharts(data) {
    const total = data.length || 1;
    const q1Options = ['全力支持', '支持但有條件', '支持但有顧慮', '持保留態度'];
    const q1Count = {};
    q1Options.forEach(o => q1Count[o] = 0);
    data.forEach(d => { if (q1Count[d.q1] !== undefined) q1Count[d.q1]++; });
    document.getElementById('q1Chart').innerHTML = q1Options.map(opt => {
      const cnt = q1Count[opt];
      const pct = Math.round(cnt / total * 100);
      return `<div class="bar-item">
        <div class="bar-label"><span>${opt}</span><span>${cnt} 票 (${pct}%)</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');

    const q2Options = ['全天候封存', '特定時段開放', '定點開放', '官方紀錄'];
    const q2Count = {};
    q2Options.forEach(o => q2Count[o] = 0);
    data.forEach(d => {
      if (d.q2_array) d.q2_array.forEach(v => { if (q2Count[v] !== undefined) q2Count[v]++; });
    });
    document.getElementById('q2Chart').innerHTML = q2Options.map(opt => {
      const cnt = q2Count[opt];
      const pct = Math.round(cnt / total * 100);
      return `<div class="bar-item">
        <div class="bar-label"><span>${opt}</span><span>${cnt} 票 (${pct}%)</span></div>
        <div class="bar-track"><div class="bar-fill green" style="width:${pct}%"></div></div>
      </div>`;
    }).join('');
  }

  // ── Table ──
  function renderTable(data) {
    const tbody = document.getElementById('tableBody');
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty-state">尚無回覆資料</td></tr>';
      return;
    }
    const badgeClass = { '全力支持': 'badge-support', '支持但有條件': 'badge-condition', '支持但有顧慮': 'badge-concern', '持保留態度': 'badge-reserve' };
    tbody.innerHTML = data.map((row, i) => {
      const dt = new Date(row.timestamp);
      const dateStr = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
      const timeStr = `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const cls = badgeClass[row.q1] || '';
      const tags = row.q2_array && row.q2_array.length > 0
        ? `<div class="q2-tags">${row.q2_array.map(t => `<span class="q2-tag">${t}</span>`).join('')}</div>`
        : '<span style="color:#555">（未選）</span>';
      return `<tr>
        <td style="color:var(--muted)">${data.length - i}</td>
        <td class="timestamp">${dateStr}<br>${timeStr}</td>
        <td class="name-cell">${row.name || '匿名'}</td>
        <td><span class="badge ${cls}">${row.q1}</span></td>
        <td>${tags}</td>
        <td>
          <div class="action-btns">
            <button class="btn-edit" onclick="openEdit('${row.id}')">✏️ 修改</button>
            <button class="btn-delete" onclick="openDelete('${row.id}')">🗑️ 刪除</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // ── Edit ──
  window.openEdit = function(id) {
    const row = allData.find(d => d.id === id);
    if (!row) return;
    currentEditId = id;
    document.getElementById('editName').value = row.name || '';
    document.getElementById('editQ1').value = row.q1 || '全力支持';
    const q2arr = row.q2_array || [];
    ['editQ2_1','editQ2_2','editQ2_3','editQ2_4'].forEach(cbId => {
      const el = document.getElementById(cbId);
      el.checked = q2arr.includes(el.value);
    });
    const dt = new Date(row.timestamp);
    document.getElementById('editModalSub').textContent =
      `編輯 ${row.name || '匿名'} 於 ${dt.toLocaleString('zh-TW')} 的填答`;
    document.getElementById('editModal').classList.add('show');
  };

  window.saveEdit = async function() {
    if (!currentEditId) return;
    const name = document.getElementById('editName').value.trim() || '匿名';
    const q1 = document.getElementById('editQ1').value;
    const q2_array = ['editQ2_1','editQ2_2','editQ2_3','editQ2_4']
      .filter(id => document.getElementById(id).checked)
      .map(id => document.getElementById(id).value);
    const q2 = q2_array.length > 0 ? q2_array.join('、') : '（未選）';
    try {
      await update(ref(db, `surveys/${currentEditId}`), { name, q1, q2, q2_array });
      closeModal('editModal');
      showToast('✅ 資料已成功更新', 'success');
      window.loadData();
    } catch(e) {
      showToast('❌ 更新失敗：' + e.message, 'error');
    }
  };

  // ── Delete ──
  window.openDelete = function(id) {
    const row = allData.find(d => d.id === id);
    if (!row) return;
    currentDeleteId = id;
    const dt = new Date(row.timestamp);
    document.getElementById('deleteModalSub').textContent =
      `「${row.name || '匿名'}」於 ${dt.toLocaleString('zh-TW')} 的填答`;
    document.getElementById('deleteModal').classList.add('show');
  };

  window.confirmDelete = async function() {
    if (!currentDeleteId) return;
    try {
      await remove(ref(db, `surveys/${currentDeleteId}`));
      closeModal('deleteModal');
      showToast('🗑️ 資料已刪除', 'success');
      window.loadData();
    } catch(e) {
      showToast('❌ 刪除失敗：' + e.message, 'error');
    }
  };

  // ── Modal helpers ──
  window.closeModal = function(id) {
    document.getElementById(id).classList.remove('show');
  };
  document.querySelectorAll('.modal-overlay').forEach(el => {
    el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.show').forEach(el => el.classList.remove('show'));
  });

  // ── Toast ──
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Export Excel ──
  window.exportExcel = function() {
    if (allData.length === 0) { alert('目前沒有資料可以下載。'); return; }
    const wsData = [
      ['序號', '填答時間', '稱呼', 'Q1 手機交出意願', 'Q2 全天候封存', 'Q2 特定時段開放', 'Q2 定點開放', 'Q2 官方紀錄', 'Q2 所有選項']
    ];
    allData.slice().reverse().forEach((row, i) => {
      const dt = new Date(row.timestamp);
      const dateStr = `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      const q2arr = row.q2_array || [];
      wsData.push([
        i + 1, dateStr, row.name || '匿名', row.q1 || '',
        q2arr.includes('全天候封存') ? '✓' : '',
        q2arr.includes('特定時段開放') ? '✓' : '',
        q2arr.includes('定點開放') ? '✓' : '',
        q2arr.includes('官方紀錄') ? '✓' : '',
        row.q2 || ''
      ]);
    });
    const total = allData.length;
    const q1Count = { '全力支持': 0, '支持但有條件': 0, '支持但有顧慮': 0, '持保留態度': 0 };
    const q2Count = { '全天候封存': 0, '特定時段開放': 0, '定點開放': 0, '官方紀錄': 0 };
    allData.forEach(d => {
      if (q1Count[d.q1] !== undefined) q1Count[d.q1]++;
      (d.q2_array || []).forEach(v => { if (q2Count[v] !== undefined) q2Count[v]++; });
    });
    const summaryData = [
      ['雲科 × 湖山親子活動意願調查統計', '', ''],
      ['匯出時間', new Date().toLocaleString('zh-TW'), ''],
      ['', '', ''],
      ['【Q1 手機交出意願】', '票數', '佔比'],
      ['全力支持', q1Count['全力支持'], `${Math.round(q1Count['全力支持']/total*100)}%`],
      ['支持，但有條件', q1Count['支持但有條件'], `${Math.round(q1Count['支持但有條件']/total*100)}%`],
      ['支持，但有顧慮', q1Count['支持但有顧慮'], `${Math.round(q1Count['支持但有顧慮']/total*100)}%`],
      ['持保留態度', q1Count['持保留態度'], `${Math.round(q1Count['持保留態度']/total*100)}%`],
      ['合計', total, '100%'],
      ['', '', ''],
      ['【Q2 保管配套偏好】', '票數（複選）', ''],
      ['全天候封存', q2Count['全天候封存'], ''],
      ['特定時段開放', q2Count['特定時段開放'], ''],
      ['定點開放', q2Count['定點開放'], ''],
      ['官方紀錄', q2Count['官方紀錄'], ''],
    ];
    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.aoa_to_sheet(summaryData);
    ws1['!cols'] = [{ wch: 22 }, { wch: 14 }, { wch: 8 }];
    XLSX.utils.book_append_sheet(wb, ws1, '統計摘要');
    const ws2 = XLSX.utils.aoa_to_sheet(wsData);
    ws2['!cols'] = [{ wch: 6 }, { wch: 18 }, { wch: 14 }, { wch: 18 }, { wch: 12 }, { wch: 14 }, { wch: 10 }, { wch: 10 }, { wch: 30 }];
    XLSX.utils.book_append_sheet(wb, ws2, '回覆明細');
    const today = new Date();
    const fname = `意願調查_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}.xlsx`;
    XLSX.writeFile(wb, fname);
  };
</script>

</script>
</body>
</html>
